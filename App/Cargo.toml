[package]
name = "syncnotes-app"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.35"
egui = "0.35"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
dirs = "6"
image = "0.25"
tray-icon = "0.19"

# gtk is only needed to drive the tray icon's event loop on Linux (see
# tray.rs); pulling it in unconditionally breaks Windows builds, since its
# glib-sys build script requires pkg-config, which windows-latest runners
# don't have.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Windows drives the tray icon's event loop with winit instead (already in
# the dependency tree via eframe, so this doesn't pull in anything new).
[target.'cfg(target_os = "windows")'.dependencies]
winit = "0.30"
