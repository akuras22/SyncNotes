[package]
name = "syncnotes-app"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.35"
egui = "0.35"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
dirs = "6"
image = "0.25"
notify = "8.2"
notify-debouncer-full = "0.7"
sha2 = "0.11"
# default-features off: the only thing that pulls in is Linux's "libxdo"
# feature, used solely for the predefined Copy/Cut/Paste/SelectAll menu
# items via X11 keystroke simulation. We only ever build custom MenuItems
# (Show Settings / Quit), so we don't need it - and skipping it means
# end users and CI don't need libxdo installed at all just to link.
tray-icon = { version = "0.19", default-features = false }

# gtk is only needed to drive the tray icon's event loop on Linux (see
# tray.rs); pulling it in unconditionally breaks Windows builds, since its
# glib-sys build script requires pkg-config, which windows-latest runners
# don't have.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Windows drives the tray icon's event loop with winit instead (already in
# the dependency tree via eframe, so this doesn't pull in anything new).
[target.'cfg(target_os = "windows")'.dependencies]
winit = "0.30"
