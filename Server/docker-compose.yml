services:
  syncnotes:
    image: python:3.12-slim
    container_name: syncnotes
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - syncnotes_uploads:/app/uploads
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python app.py"
    restart: unless-stopped

