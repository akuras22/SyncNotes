{% extends "base.html" %}
{% block title %}Download — SyncNotes{% endblock %}
{% block content %}
<div class="panel mb-4">
  <div class="panel-header">Download SyncNotes Desktop App</div>
  <div class="panel-body">
    <p class="text-muted" style="margin-top: 0;">
      Sync your Rnote files to your server with the lightweight desktop app.
      Choose your platform below.
    </p>
    <div id="releases-container">
      <p class="text-muted" id="loading-text">Loading releases...</p>
    </div>
  </div>
</div>

<script>
(async function() {
  const res = await fetch('https://api.github.com/repos/akuras22/SyncNotes/releases');
  if (!res.ok) {
    document.getElementById('loading-text').textContent = 'Failed to load releases.';
    return;
  }
  const releases = await res.json();
  const container = document.getElementById('releases-container');
  container.innerHTML = '';

  if (releases.length === 0) {
    container.innerHTML = '<p class="text-muted">No releases yet.</p>';
    return;
  }

  for (const release of releases) {
    const linuxAsset = release.assets.find(a => a.name.includes('linux'));
    const windowsAsset = release.assets.find(a => a.name.includes('windows'));

    const div = document.createElement('div');
    div.className = 'settings-section';
    div.style.cssText = 'border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px;';

    const header = document.createElement('div');
    header.className = 'flex items-center justify-between';

    const title = document.createElement('h4');
    title.style.cssText = 'font-size:16px;font-weight:700;margin:0;';
    title.textContent = release.tag_name + (release.name && release.name !== release.tag_name ? ' — ' + release.name : '');

    const date = document.createElement('span');
    date.className = 'text-muted text-sm';
    date.textContent = new Date(release.published_at).toLocaleDateString();

    header.appendChild(title);
    header.appendChild(date);
    div.appendChild(header);

    if (release.body) {
      const notes = document.createElement('pre');
      notes.style.cssText = 'font-size:13px;color:var(--text-secondary);margin:8px 0;white-space:pre-wrap;font-family:inherit;';
      notes.textContent = release.body;
      div.appendChild(notes);
    }

    const actions = document.createElement('div');
    actions.className = 'flex';
    actions.style.cssText = 'gap:8px;margin-top:8px;';

    if (linuxAsset) {
      const link = document.createElement('a');
      link.className = 'btn btn-default';
      link.href = linuxAsset.browser_download_url;
      link.textContent = 'Download for Linux';
      actions.appendChild(link);
    }

    if (windowsAsset) {
      const link = document.createElement('a');
      link.className = 'btn btn-primary';
      link.href = windowsAsset.browser_download_url;
      link.textContent = 'Download for Windows';
      actions.appendChild(link);
    }

    if (!linuxAsset && !windowsAsset) {
      const span = document.createElement('span');
      span.className = 'text-muted text-sm';
      span.textContent = 'No binaries for this release.';
      actions.appendChild(span);
    }

    div.appendChild(actions);
    container.appendChild(div);
  }
})();
</script>
{% endblock %}
