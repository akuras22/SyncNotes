{% extends "base.html" %}
{% block title %}Register — SyncNotes{% endblock %}
{% block content %}
<div class="window">
  <div class="window-header">
    <h1 class="window-title">Create account</h1>
    <p class="window-subtitle">Get started with SyncNotes</p>
  </div>
  <form method="POST">
    <div class="window-body">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" id="username" type="text" name="username" placeholder="Username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" name="email" placeholder="Email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" name="password" placeholder="Password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password</label>
        <input class="form-input" id="confirm" type="password" name="confirm" placeholder="Confirm password" required>
      </div>
    </div>
    <div class="window-footer">
      <a class="btn btn-flat" href="{{ url_for('web.login') }}">Already have an account?</a>
      <button class="btn btn-primary" type="submit">Register</button>
    </div>
  </form>
</div>
{% endblock %}
