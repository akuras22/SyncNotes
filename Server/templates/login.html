{% extends "base.html" %}
{% block title %}Login — SyncNotes{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-1">Welcome back</h3>
        <p class="text-muted text-center mb-4 small">Sign in to your account</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="text-center mt-3 mb-0">
          <a href="{{ url_for('web.register') }}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
