{% extends "base.html" %}
{% block title %}Login — SyncNotes{% endblock %}
{% block content %}
<div class="window">
  <div class="window-header">
    <h1 class="window-title">Welcome back</h1>
    <p class="window-subtitle">Sign in to your account</p>
  </div>
  <form method="POST">
    <div class="window-body">
      <div class="form-group">
        <label class="form-label" for="login">Username or Email</label>
        <input class="form-input" id="login" type="text" name="login" placeholder="Username or email" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" name="password" placeholder="Password" required>
      </div>
    </div>
    <div class="window-footer">
      <a class="btn btn-flat" href="{{ url_for('web.register') }}">Create account</a>
      <button class="btn btn-primary" type="submit">Sign In</button>
    </div>
  </form>
</div>
{% endblock %}
