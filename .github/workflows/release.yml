name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            asset_name: syncnotes-linux-x86_64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
            asset_name: syncnotes-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev
          # tray-icon supports both libappindicator and libayatana
          sudo apt-get install -y -qq libappindicator3-dev 2>/dev/null || \
          sudo apt-get install -y -qq libayatana-appindicator3-dev 2>/dev/null || true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release
        working-directory: App

      - name: Rename binary for release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "App/target/release/syncnotes-app${{ matrix.ext }}" "dist/${{ matrix.asset_name }}${{ matrix.ext }}"

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          name: SyncNotes ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/${{ matrix.asset_name }}${{ matrix.ext }}
